version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stunning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: stunning_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stunning-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stunning-api
    restart: unless-stopped
    ports:
      - "5176:5176"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=stunning_builder;Username=postgres;Password=password123
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
